<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 社群軟體預覽設定開始 -->
    <title>TBW / DWPD / WAI計算機</title>
    
    <!-- 網頁內容描述 (這就是 LINE 會抓取的內文) -->
    <meta name="description" content="計算硬碟的TBW、DWPD與WAI。">
    
    <!-- Open Graph 標籤 (給 Facebook, LINE 等抓取標題和敘述用的標準格式) -->
    <meta property="og:title" content="TBW / DWPD / WAI計算機">
    <meta property="og:description" content="計算硬碟的TBW、DWPD與WAI。">
    <meta property="og:type" content="website">
    <!-- 社群軟體預覽設定結束 -->

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-5xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-wider">硬碟壽命計算工具</h1>
            <p class="text-blue-100 text-sm mt-1">TBW, DWPD & WAI 整合計算</p>
        </div>

        <div class="p-6">
            <!-- 頂部獨立區域 (檔案上傳與裝置資訊) -->
            <div class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-6 bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <!-- 上傳區 -->
                <div class="col-span-1 flex flex-col justify-center border-2 border-dashed border-blue-300 rounded-lg p-6 bg-blue-50 relative hover:bg-blue-100 transition-colors">
                    <input type="file" id="logFileInput" accept=".log,.txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="text-center flex flex-col items-center pointer-events-none">
                        <svg class="w-8 h-8 text-blue-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="text-sm font-bold text-blue-900">匯入 JEDEC Log 檔案</span>
                        <span class="text-xs text-blue-700 mt-1">自動解析 Device, Capacity 與寫入量</span>
                    </div>
                </div>
                
                <!-- 裝置資訊區 -->
                <div class="col-span-2 flex flex-col justify-center pl-0 md:pl-4 border-t md:border-t-0 md:border-l border-gray-200 pt-4 md:pt-0">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Device Information</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <div class="text-xs text-gray-500 mb-1">Device Name</div>
                            <div id="displayDeviceName" class="font-bold text-blue-600 text-lg break-all">尚未載入</div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <div class="text-xs text-gray-500 mb-1">Device FW</div>
                            <div id="displayDeviceFW" class="font-bold text-blue-600 text-lg break-all">尚未載入</div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <div class="text-xs text-gray-500 mb-1">Capacity</div>
                            <div id="displayCapacity" class="font-bold text-blue-600 text-lg">尚未載入</div>
                        </div>
                    </div>
                    <div id="fileUploadStatus" class="mt-3 text-sm font-semibold text-green-600 hidden"></div>
                </div>
            </div>

            <!-- 設定網格，桌面版雙欄，手機版單欄 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- ================= 左側欄位：WAI & 進階 TBW ================= -->
                <div class="space-y-6">
                    
                    <!-- WAI 計算區域 -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-sm">
                        <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider flex items-center">
                            <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            計算 WAI 
                        </h2>

                        <div class="space-y-4">
                            <!-- NAND 寫入量 -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">NAND flash write</label>
                                <div class="flex">
                                    <input type="text" id="nandWrites" placeholder="例如: 1a4fech 或 1724396" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    <select id="nandBase" class="bg-gray-100 px-3 py-2 border-t border-b border-r border-gray-300 rounded-r-lg text-gray-700 outline-none">
                                        <option value="16">16進位 (Hex)</option>
                                        <option value="10">10進位 (Dec)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Host 寫入量 -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Host Writes</label>
                                <div class="flex">
                                    <input type="text" id="hostWrites" placeholder="例如: 9787ch 或 620668" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    <select id="hostBase" class="bg-gray-100 px-3 py-2 border-t border-b border-r border-gray-300 rounded-r-lg text-gray-700 outline-none">
                                        <option value="16">16進位 (Hex)</option>
                                        <option value="10">10進位 (Dec)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- WAI 結果 -->
                            <div class="pt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">WAI</label>
                                <input type="number" id="waiResult" readonly placeholder="自動計算" 
                                    class="w-full px-4 py-2 bg-green-50 border border-green-200 rounded-lg text-green-800 font-bold outline-none cursor-not-allowed">
                            </div>
                        </div>
                    </div>

                    <!-- 進階 TBW 計算區域 -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-sm">
                        <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider flex items-center">
                            <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            TBW
                        </h2>
                        
                        <div class="space-y-4">
                            <!-- PE Cycle -->
                            <div>
                                <label for="peCycle" class="block text-sm font-medium text-gray-700 mb-1">P/E Cycle</label>
                                <input type="number" id="peCycle" value="3000" min="1" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>

                            <!-- 同步的硬碟容量 (左側) -->
                            <div>
                                <label for="advCapacity" class="block text-sm font-medium text-gray-700 mb-1">Device Capacity</label>
                                <div class="flex">
                                    <input type="number" id="advCapacity" value="1024" min="1" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                                    <select id="advUnit" class="bg-gray-100 px-4 py-2 border-t border-b border-r border-gray-300 rounded-r-lg text-gray-700 outline-none">
                                        <option value="GB">GB</option>
                                        <option value="TB">TB</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 進階 TBW 結果 -->
                            <div class="pt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">TBW</label>
                                <div class="flex items-center gap-2">
                                    <input type="number" id="advTbwResult" readonly placeholder="自動計算" 
                                        class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-lg text-lg font-bold text-blue-900 outline-none cursor-not-allowed">
                                    <button onclick="applyAdvTbwToRight()" class="px-3 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm whitespace-nowrap text-sm" title="將此數值帶入右側計算DWPD">
                                        帶入右側 ➔
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ================= 右側欄位：基本規格 & 雙向計算 ================= -->
                <div class="space-y-6">
                    
                    <!-- 基礎設定區域 -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-sm">
                        <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider flex items-center">
                            <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            硬碟規格
                        </h2>
                        
                        <div class="space-y-4">
                            <!-- 保固期輸入 -->
                            <div>
                                <label for="warranty" class="block text-sm font-medium text-gray-700 mb-1">Warranty (year)</label>
                                <input type="number" id="warranty" value="3" min="0.1" step="0.1" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                            </div>

                            <!-- 硬碟容量輸入 -->
                            <div>
                                <label for="capacity" class="block text-sm font-medium text-gray-700 mb-1">Device Capacity</label>
                                <div class="flex">
                                    <input type="number" id="capacity" value="1024" min="1" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                                    <select id="unit" class="bg-gray-100 px-4 py-2 border-t border-b border-r border-gray-300 rounded-r-lg text-gray-700 outline-none">
                                        <option value="GB">GB</option>
                                        <option value="TB">TB</option>
                                    </select>
                                </div>
                                <div class="text-xs text-gray-500 mt-1 pl-1">備註：計算進階 TBW 時，1 TB = 1024 GB；計算 DWPD 時，1 TB = 1000 GB 依業界慣例。</div>
                            </div>
                        </div>
                    </div>

                    <!-- 計算區域 -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-sm">
                        <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider flex items-center">
                            <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                            輸入任一數值進行雙向計算
                        </h2>
                        
                        <div class="space-y-2">
                            <!-- TBW 輸入/輸出 -->
                            <div>
                                <label for="tbw" class="block text-sm font-medium text-gray-700 mb-1">TBW</label>
                                <input type="number" id="tbw" placeholder="例如: 365 或從左側帶入" 
                                    class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-lg font-bold text-blue-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition-colors">
                            </div>

                            <!-- 雙向箭頭圖示 -->
                            <div class="flex justify-center text-gray-400 py-1">
                                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                                </svg>
                            </div>

                            <!-- DWPD 輸入/輸出 -->
                            <div>
                                <label for="dwpd" class="block text-sm font-medium text-gray-700 mb-1">DWPD</label>
                                <input type="number" id="dwpd" placeholder="例如: 1" 
                                    class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-lg font-bold text-gray-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition-colors">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= 元素定義 =================
        // 基礎規格
        const warrantyInput = document.getElementById('warranty');
        const capacityInput = document.getElementById('capacity');
        const unitSelect = document.getElementById('unit');
        
        // 雙向計算
        const tbwInput = document.getElementById('tbw');
        const dwpdInput = document.getElementById('dwpd');
        let lastEdited = 'tbw'; 

        // WAI & 進階 TBW
        const nandWrites = document.getElementById('nandWrites');
        const nandBase = document.getElementById('nandBase');
        const hostWrites = document.getElementById('hostWrites');
        const hostBase = document.getElementById('hostBase');
        const waiResult = document.getElementById('waiResult');
        const peCycle = document.getElementById('peCycle');
        const advTbwResult = document.getElementById('advTbwResult');
        
        // 檔案上傳
        const logFileInput = document.getElementById('logFileInput');
        const fileUploadStatus = document.getElementById('fileUploadStatus');

        // 左側同步硬碟容量
        const advCapacityInput = document.getElementById('advCapacity');
        const advUnitSelect = document.getElementById('advUnit');

        // ================= WAI 與 進階 TBW 邏輯 =================

        // 解析輸入值 (支援 10 進位 與 16 進位(含結尾h或開頭0x))
        function parseCustomNumber(val, base) {
            val = val.trim().toLowerCase();
            if (val === '') return NaN;

            if (base === '16') {
                if (val.endsWith('h')) val = val.slice(0, -1);
                if (val.startsWith('0x')) val = val.slice(2);
                return parseInt(val, 16);
            } else {
                return parseFloat(val);
            }
        }

        function calculateWAIAndAdvTBW() {
            // 1. 計算 WAI
            const nandDec = parseCustomNumber(nandWrites.value, nandBase.value);
            const hostDec = parseCustomNumber(hostWrites.value, hostBase.value);

            let wai = NaN;
            if (!isNaN(nandDec) && !isNaN(hostDec) && hostDec !== 0) {
                wai = nandDec / hostDec;
                waiResult.value = wai.toFixed(2);
            } else {
                waiResult.value = '';
            }

            // 2. 計算進階 TBW
            const capVal = parseFloat(capacityInput.value);
            const isTB = (unitSelect.value === 'TB');
            const peVal = parseFloat(peCycle.value);

            // 依據公式，此處容量使用 GB 計算 (1 TB = 1024 GB)
            const capGB = isTB ? capVal * 1024 : capVal;

            if (!isNaN(wai) && !isNaN(capGB) && !isNaN(peVal) && wai > 0) {
                // 公式：容量(GB) x PE cycle / WAI / 1024
                const calcTbw = (capGB * peVal) / wai / 1024;
                advTbwResult.value = Math.round(calcTbw); // 四捨五入至整數
            } else {
                advTbwResult.value = '';
            }
        }

        // 將左側計算出的進階 TBW 帶入右側欄位，並觸發 DWPD 重新計算
        function applyAdvTbwToRight() {
            if (advTbwResult.value && !isNaN(advTbwResult.value)) {
                tbwInput.value = advTbwResult.value;
                calculateDWPD(); // 觸發右側重新計算
                
                // 增加一點視覺提示效果
                tbwInput.classList.add('bg-green-100');
                setTimeout(() => tbwInput.classList.remove('bg-green-100'), 500);
            }
        }

        // ================= 雙向計算邏輯 (TBW <-> DWPD) =================

        // 取得以 TB 為單位的硬碟容量 (DWPD 一般業界慣例 1TB=1000GB)
        function getCapacityInTBForDWPD() {
            const capacity = parseFloat(capacityInput.value);
            if (isNaN(capacity) || capacity <= 0) return 0;
            return unitSelect.value === 'GB' ? capacity / 1000 : capacity;
        }

        function getWarrantyYears() {
            const years = parseFloat(warrantyInput.value);
            if (isNaN(years) || years <= 0) return 0;
            return years;
        }

        function calculateDWPD() {
            const tbw = parseFloat(tbwInput.value);
            const capTB = getCapacityInTBForDWPD();
            const years = getWarrantyYears();

            if (isNaN(tbw) || capTB === 0 || years === 0) {
                if(tbwInput.value === '') dwpdInput.value = '';
                return;
            }

            const dwpd = tbw / (capTB * 365 * years);
            dwpdInput.value = Number.isInteger(dwpd) ? dwpd : parseFloat(dwpd.toFixed(4));
            lastEdited = 'tbw';
        }

        function calculateTBW() {
            const dwpd = parseFloat(dwpdInput.value);
            const capTB = getCapacityInTBForDWPD();
            const years = getWarrantyYears();

            if (isNaN(dwpd) || capTB === 0 || years === 0) {
                if(dwpdInput.value === '') tbwInput.value = '';
                return;
            }

            const tbw = dwpd * capTB * 365 * years;
            tbwInput.value = Number.isInteger(tbw) ? tbw : parseFloat(tbw.toFixed(2));
            lastEdited = 'dwpd';
        }

        function handleBaseSettingChange() {
            // 右側雙向計算處理
            if (lastEdited === 'tbw' && tbwInput.value !== '') {
                calculateDWPD(); 
            } else if (lastEdited === 'dwpd' && dwpdInput.value !== '') {
                calculateTBW();  
            }
            
            // 左側進階 TBW 處理 (因為改變了硬碟容量)
            calculateWAIAndAdvTBW();
        }

        // 同步左右兩側的容量欄位
        function handleLeftCapacityChange() {
            capacityInput.value = advCapacityInput.value;
            unitSelect.value = advUnitSelect.value;
            handleBaseSettingChange();
        }

        // 同步左右兩側的容量欄位
        function handleRightCapacityChange() {
            advCapacityInput.value = capacityInput.value;
            advUnitSelect.value = unitSelect.value;
            handleBaseSettingChange();
        }

        // ================= 檔案上傳與解析邏輯 =================
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) {
                fileUploadStatus.classList.add('hidden');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                
                let lastId241Value = null;
                let lastId245Value = null;
                let rawDeviceName = "未知";
                let deviceCapacity = null;
                let deviceUnit = "GB";

                // 由上往下尋找裝置資訊
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (rawDeviceName === "未知") {
                        const nameMatch = line.match(/(?:Device Name\s*:|DEVICE NAME:)\s*(.+)/i);
                        if (nameMatch) rawDeviceName = nameMatch[1].trim();
                    }
                    if (!deviceCapacity) {
                        const capMatch = line.match(/(?:Device Capacity\s*:|Capacity\s*=)\s*([\d\.]+)\s*(GB|TB|G|T)/i);
                        if (capMatch) {
                            deviceCapacity = parseFloat(capMatch[1]);
                            deviceUnit = capMatch[2].toUpperCase().startsWith('T') ? 'TB' : 'GB';
                        }
                    }
                    if (rawDeviceName !== "未知" && deviceCapacity !== null) break;
                }

                // 解析 Device Name 和 Device FW
                let parsedDeviceName = rawDeviceName;
                let parsedDeviceFW = "未知";
                
                if (rawDeviceName !== "未知") {
                    // 將字串以一個或多個空白分割
                    const nameParts = rawDeviceName.split(/\s+/);
                    if (nameParts.length > 0) {
                        parsedDeviceName = nameParts[0]; // 第一個值作為 Device Name
                    }
                    if (nameParts.length >= 3) {
                        parsedDeviceFW = nameParts[2]; // 第三個值作為 Device FW
                    }
                }

                // 將 Capacity 取整數
                let displayCapacityValue = deviceCapacity ? Math.round(deviceCapacity) : null;

                // 更新頂部裝置資訊 UI
                document.getElementById('displayDeviceName').textContent = parsedDeviceName;
                document.getElementById('displayDeviceFW').textContent = parsedDeviceFW;
                document.getElementById('displayCapacity').textContent = displayCapacityValue ? `${displayCapacityValue} ${deviceUnit}` : "未知";

                // 自動帶入硬碟容量並同步左右欄位
                if (deviceCapacity) {
                    const roundedCap = Math.round(deviceCapacity);
                    capacityInput.value = roundedCap;
                    advCapacityInput.value = roundedCap;
                    unitSelect.value = deviceUnit;
                    advUnitSelect.value = deviceUnit;
                }

                // 由後往前尋找，確保抓到的是最後一次（Latest）的數值
                for (let i = lines.length - 1; i >= 0; i--) {
                    const line = lines[i].trim();
                    // 正規表達式尋找 ID 241 和 245
                    // 格式: ID 241 0032h 64h 64h 00000009787ch 00h Total LBAs Written
                    const match241 = line.match(/^ID\s+241\s+[\da-fA-F]+h\s+[\da-fA-F]+h\s+[\da-fA-F]+h\s+([\da-fA-F]+h)\s+[\da-fA-F]+h\s+Total LBAs Written/i);
                    const match245 = line.match(/^ID\s+245\s+[\da-fA-F]+h\s+[\da-fA-F]+h\s+[\da-fA-F]+h\s+([\da-fA-F]+h)\s+[\da-fA-F]+h\s+Vendor Specific/i);

                    if (match241 && !lastId241Value) {
                        let val = match241[1].toLowerCase();
                        val = val.replace(/^0+/, ''); // 移除前導 0
                        if (val === 'h') val = '0h';  // 如果全是 0，保留 0h
                        lastId241Value = val;
                    }

                    if (match245 && !lastId245Value) {
                        let val = match245[1].toLowerCase();
                        val = val.replace(/^0+/, '');
                        if (val === 'h') val = '0h';
                        lastId245Value = val;
                    }

                    // 如果兩個都找到了，就不用繼續往前找了
                    if (lastId241Value && lastId245Value) {
                        break;
                    }
                }

                // 進行更新畫面及計算
                if (lastId241Value && lastId245Value) {
                    hostWrites.value = lastId241Value;
                    nandWrites.value = lastId245Value;
                    
                    // 強制設定為 16 進位
                    hostBase.value = '16';
                    nandBase.value = '16';
                    
                    // 執行連動計算 (涵蓋容量與WAI)
                    handleBaseSettingChange();

                    // 顯示成功訊息
                    fileUploadStatus.textContent = '✔ 解析成功！已自動帶入數值並完成計算。';
                    fileUploadStatus.className = 'mt-3 text-sm font-semibold text-green-600';
                    fileUploadStatus.classList.remove('hidden');
                } else {
                    // 若沒找到寫入量，但有找到容量，一樣觸發連動計算
                    handleBaseSettingChange();
                    
                    // 顯示錯誤/警告訊息
                    fileUploadStatus.textContent = '⚠ 裝置資訊已更新，但無法在檔案中找到完整的 ID 241 或 ID 245 寫入量數值。';
                    fileUploadStatus.className = 'mt-3 text-sm font-semibold text-amber-600';
                    fileUploadStatus.classList.remove('hidden');
                }
            };
            
            reader.onerror = function() {
                fileUploadStatus.textContent = '檔案讀取失敗。';
                fileUploadStatus.className = 'mt-2 text-xs font-semibold text-red-600';
                fileUploadStatus.classList.remove('hidden');
            };

            reader.readAsText(file);
        }

        // ================= 綁定事件監聽器 =================
        
        // 左側 WAI & Adv TBW 相關事件
        nandWrites.addEventListener('input', calculateWAIAndAdvTBW);
        hostWrites.addEventListener('input', calculateWAIAndAdvTBW);
        nandBase.addEventListener('change', calculateWAIAndAdvTBW);
        hostBase.addEventListener('change', calculateWAIAndAdvTBW);
        peCycle.addEventListener('input', calculateWAIAndAdvTBW);

        advCapacityInput.addEventListener('input', handleLeftCapacityChange);
        advUnitSelect.addEventListener('change', handleLeftCapacityChange);

        // 右側雙向計算相關事件
        tbwInput.addEventListener('input', calculateDWPD);
        dwpdInput.addEventListener('input', calculateTBW);
        
        // 基礎設定相關事件 (同時影響左右側)
        warrantyInput.addEventListener('input', handleBaseSettingChange);
        capacityInput.addEventListener('input', handleRightCapacityChange);
        unitSelect.addEventListener('change', handleRightCapacityChange);

        // 檔案上傳事件
        logFileInput.addEventListener('change', handleFileUpload);

    </script>
</body>
</html>
